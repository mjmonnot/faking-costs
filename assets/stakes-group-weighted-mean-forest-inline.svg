<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="forest-title forest-desc" class="forest-svg" width="100%" height="auto" focusable="false">
<title id="forest-title">Cross-trait weighted mean r by assessment stakes</title>
<desc id="forest-desc">Forest plot of inverse-variance-weighted mean Big Five by GMA correlations for six stakes groups. Horizontal bars are 95 percent confidence intervals. Low-stakes community ranks highest; high-stakes applicants rank lowest. Circles mark low-stakes, squares military, diamonds high-stakes.</desc>
