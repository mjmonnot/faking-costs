<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-labelledby="forest-title-m forest-desc-m" class="forest-svg forest-svg-mobile" width="100%" height="auto" focusable="false">
<title id="forest-title-m">Cross-trait weighted mean r by assessment stakes</title>
<desc id="forest-desc-m">Forest plot of inverse-variance-weighted mean Big Five by GMA correlations for six stakes groups. Each study label sits above its confidence interval. Circles mark low-stakes, squares military, diamonds high-stakes.</desc>
